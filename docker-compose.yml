services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      DEFAULT_CUTOFF: "${DEFAULT_CUTOFF:-10:00}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s
    restart: unless-stopped
